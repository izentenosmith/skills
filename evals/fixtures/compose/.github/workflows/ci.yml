name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    # Same versions as production: RDS Postgres 15, ElastiCache Redis 7.2, Meilisearch Cloud v1.6.
    services:
      postgres:
        image: postgres:15.8-alpine
        env:
          POSTGRES_USER: shopdesk
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: shopdesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shopdesk -d shopdesk"
          --health-interval 5s --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
      meilisearch:
        image: getmeili/meilisearch:v1.6.2
        env:
          MEILI_MASTER_KEY: ci-only-master-key
        ports: ["7700:7700"]
    env:
      DATABASE_URL: postgresql://shopdesk:ci-only@localhost:5432/shopdesk
      REDIS_URL: redis://localhost:6379/0
      MEILI_URL: http://localhost:7700
      MEILI_MASTER_KEY: ci-only-master-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m shopdesk.migrate
      - run: python -c "import shopdesk.api"
