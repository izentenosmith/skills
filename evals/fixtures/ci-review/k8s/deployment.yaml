apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-api
spec:
  replicas: 6
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: storefront-api }
  template:
    metadata:
      labels: { app: storefront-api }
    spec:
      containers:
        - name: api
          image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/storefront-api:latest
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
