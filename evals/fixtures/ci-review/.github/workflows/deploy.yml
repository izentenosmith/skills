name: deploy

on:
  push:
    branches: [main]

permissions: write-all

env:
  REGISTRY: 123456789012.dkr.ecr.eu-west-1.amazonaws.com
  SLACK_WEBHOOK: https://hooks.slack.com/services/T0EVAL/B0EVAL/eval-fake-webhook-token-0001

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1
      - run: aws ecr get-login-password | docker login --username AWS --password-stdin $REGISTRY
      - run: docker build --build-arg ENV=staging -t $REGISTRY/storefront-api:latest .
      - run: docker push $REGISTRY/storefront-api:latest
      - run: aws eks update-kubeconfig --name staging-eu --region eu-west-1 && kubectl apply -f k8s/

  deploy-prod:
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1
      - run: aws ecr get-login-password | docker login --username AWS --password-stdin $REGISTRY
      - run: docker build --build-arg ENV=prod -t $REGISTRY/storefront-api:latest .
      - run: docker push $REGISTRY/storefront-api:latest
      - run: ./scripts/deploy-prod.sh
      - uses: rtCamp/action-slack-notify@master
        env:
          SLACK_WEBHOOK: ${{ env.SLACK_WEBHOOK }}
          SLACK_MESSAGE: "storefront-api deployed to prod"
