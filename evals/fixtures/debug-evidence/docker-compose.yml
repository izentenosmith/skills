name: shopfront

services:
  api:
    build: ./api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 512m
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped

  worker:
    build: ./worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped

  scheduler:
    build: ./scheduler
    environment:
      REDIS_URL: redis://redis:6379/0
    mem_limit: 128m
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped

  migrate:
    build: ./migrate
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped

  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: shop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    restart: unless-stopped

volumes:
  pgdata:
