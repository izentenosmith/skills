name: Preview deploy

# Deploys the preview CI built for a pull request.
#
# workflow_run always runs this file as it is on the default branch, with the base
# repository's token and secrets, so a pull request cannot change what runs here. We never
# check out the pull request: the checkout below is main, and the PR's build arrives as an
# artifact. That is what makes it safe to run for pull requests from forks.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  deploy:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Download the preview build
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # The PR number comes from the fork's run, so treat it as untrusted.
      - name: Read the PR number
        id: pr
        run: |
          number="$(cat pr/number)"
          if ! [[ "$number" =~ ^[0-9]+$ ]]; then
            echo "::error::pr/number is not a number"
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name tidepool-docs --branch "pr-$PR_NUMBER"
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment the preview link
        run: node scripts/comment-preview.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
