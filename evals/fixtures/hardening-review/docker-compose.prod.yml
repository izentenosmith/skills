name: invoicer

services:
  proxy:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports:
      - "80:8080"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/certs:/etc/nginx/certs:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
      - /var/cache/nginx:size=64m
    user: "101:101"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 128
    restart: unless-stopped
    depends_on: [api]

  api:
    image: registry.example.com/invoicer-api:latest
    build: ./api
    environment:
      DATABASE_URL: postgresql://invoicer:${POSTGRES_PASSWORD}@postgres:5432/invoicer
      STRIPE_SECRET_KEY: eval-fake-stripe-live-key-0042
      SENTRY_DSN: ${SENTRY_DSN}
    volumes:
      - invoices:/srv/invoices
    restart: unless-stopped
    depends_on: [postgres]

  worker:
    image: registry.example.com/invoicer-api:latest
    command: ["python", "-m", "invoicer.worker"]
    privileged: true   # GPU for thumbnails
    environment:
      DATABASE_URL: postgresql://invoicer:${POSTGRES_PASSWORD}@postgres:5432/invoicer
    volumes:
      - invoices:/srv/invoices
    restart: unless-stopped
    depends_on: [postgres]

  updater:
    image: containrrr/watchtower:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["--interval", "300", "--cleanup"]
    restart: unless-stopped

  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: invoicer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: invoicer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  invoices:
  pgdata:
