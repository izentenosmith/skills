services:
  postgres-primary:
    image: postgres:16
    environment:
      POSTGRES_USER: tidewater
      POSTGRES_PASSWORD: eval-fake-tw-3Rv9
  postgres-replica:
    image: postgres:16
    command: ["postgres", "-c", "hot_standby=on"]
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "no"]
  elasticsearch:
    image: elasticsearch:8.15.0
  metabase:
    image: metabase/metabase:v0.50.0
    environment:
      MB_DB_CONNECTION_URI: postgres://postgres-primary:5432/tidewater
